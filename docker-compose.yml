version: '3.8'

services:
  data-echo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: data-echo-production
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - SECRET_KEY=data-echo-super-secret-key-production-2026
    volumes:
      - data-echo-db:/app/backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  data-echo-db:
